<!DOCTYPE html>
<html>
  <head>
    <meta name='viewport' content='width=device-width,initial-scale=1.0'>
    <title>Watch</title>
    <style>
      *{
        padding:0;
        margin:0;
        box-sizing:border-box;
      }
      body{
        background:#0f172a;
      }
      
      /*watch part*/
      .watch_choice{
        height:0px;
        width:0px;
        position:static;
        opacity:0;
        pointer-events:none;
        background:url('photos/see2.jpg') no-repeat center/contain border-box;
      }
      .watch{
        height:43vh;
        width:43vh;
        border:1px solid #ffff;
        border-radius:50%;
        position:relative;
        margin:0px auto;
        border:1px outset black;
        color:white;
        transform:translate(0%,20%);
      }
      .rive{
        width:15px;
        height:25px;
        position:absolute;
        top:50%;
        left:50%;
        font-size:18px;
        display:flex;
        justify-content:center;
        align-items:center;
        box-shadow: 0 0 5px blue, 0 0 10px cyan;
        border-radius:5px;
      }
      .center{
        height:10px;
        width:10px;
        border-radius:50%;
        background:red;
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%,-50%);
        opacity:1;
      }
      .bet{
        height:10px;
        width:5px;
        font-size:8px;
        position:absolute;
        top:50%;
        left:50%;
        transform-origin:center center;
      }
      .hour{
        height:13vh;
        width:1vh;
        background:black;
        border-radius:8px;
        transform-origin:bottom center;
        position:absolute;
        top:50%;
        left:50%;
        z-index:0;
      }
      .minute{
        width:1vh;
        height:16vh;
        background:black;
        border-radius:6px;
        transform-origin:top center;
        position:absolute;
        left:50%;
        top:50%;
        z-index:1;
      }
      .sec{
        height:18vh;
        width:1vh;
        background:brown;
        z-index:2;
        position:absolute;
        top:50%;
        left:50%;
        transform-origin:bottom center;
        border-radius:3px;
      }
      .time_border{
        height:50px;
        width:50px;
        border:1px solid black;
        font-size:18px;
        background:brown;
        color:white;
        display:flex;
        justify-content:center;
        align-items:center;
      }
      .time_box{
       display:flex;
       flex-flow:nowrap row;
       justify-content:center;
       align-items:center;
       gap:10%;
       border:1px solid #ffff;
       height:100px;
       width:70%;
       margin:15vh auto 0px;
      }
      
      /*Timer Part*/
      .stop_watch_choice{
        height:80vh;
        width:100%;
        background:url('photos/see5.jpg') no-repeat center/contain border-box;
        opacity:0;
        pointer-events:none;
        position:relative;
      }
      .flame{
        height:15%;
        width:80%;
        border-radius:10px;
        display:flex;
        flex-flow:nowrap row;
        justify-content:center;
        align-items:center;
        gap:10%;
        position:absolute;
        top:13vh;
        left:3vh;
      }
      .flame small{
        background:#0f172a;
        color:white;
        letter-spacing:5px;
        height:80%;
        width:25%;
        display:flex;
        justify-content:center;
        align-items:center;
        font-size:20px;
        border-radius:10px;
        text-shadow:0 0 5px white, 0 0 10px ,0 0 15px;
      }
      .numbers{
        position:absolute;
        top:35vh;
        left:15%;
        height:60%;
        width:70%;
        display:grid;
        grid-template-columns:repeat(3,1fr);
        grid-template-rows:repeat(5,1fr);
      }
      .numbers button{
        height:60px;
        width:60px;
        border-radius:50%;
        border:1px solid black;
        color:white;
        background:#0f172a;
      }
      .numbers button:hover{
        background:white;
        color:black;
      }
      ._00_{
        grid-column-start:1;
        grid-column-end:2;
        grid-row-start:4;
        grid-row-end:5;
      }
      .cancel{
        padding-top:5%;
      }
      .play{
        grid-column-start:2;
        grid-column-end:3;
        transform:rotate(-180deg);
        padding-left:1px;
      }
      .result{
        background:green;
        height:90vh;
        width:100%;
        position:fixed;
        top:0;
        left:0;
        bottom:10vh;
      }
      .turn_on{
        opacity:1;
        pointer-events:auto;
        position:fixed;
        height:92vh;
        width:100%;
      }
      
      .number{
       font-size:18px;
       display:flex;
       justify-content:center;
       align-items:center;
       position:absolute;
       top:50%;
       left:50%;
     }
      .clock{
       border-radius:50%;
       background:red;
       position:absolute;
       top:25%;
       right:0;
     }
      .con_1{
       height:90vh;
       width:90%;
       position:relative;
       background:transform;
       border:.8px solid black;
       display:flex;
       justify-content:center;
       align-items:center;
     }
     .line{
       position:absolute;
       bottom:20%;
       left:5%;
       height:10%;
       width:90%;
       background-color:green;
       border:.6px solid black;
       display:flex;
       justify-content:flex-start;
       align-items:center;
     }
     .inside_line{
       height:30%;
       width:95%;
       margin:35% 2.5%;
       border-radius:10px;
       background:cyan;
     }
     .side_line{
       position:absolute;
       bottom:20%;
       left:2%;
       top:10%;
       height:60%;
       width:20%;
       display:flex;
       flex-flow:nowrap column;
       justify-content:center;
       align-items:center;
       gap:10%;
     }
     
     .hand{
       transform-origin:bottom center;
       width:10px;
       border-radius:10px;
       position:absolute;
       bottom:50%;
       left:50%;
       background:green;
     }
     .h_circle{
       position:absolute;
       top:0;
       left:-15%;
       width:150%;
       height:17%;
       border-radius:50%;
       background:white;
     }
     .side_box{
       height:20%;
       width:100%;
       font-size:18px;
       letter-spacing:1.2px;
       background:#53c;
       border:1px solid blue;
       color:white;
       display:flex;
       justify-content:center;
       align-items:center;
     }
     .dot{
       position:absolute;
       top:50%;
       left:50%;
       height:10px;
       width:10px;
       border-radius:50%;
       background:yellow;
       transform:translate(-50%,-50%);
     }
     
     /*shape_2*/
     .con_2{
       width:100%;
       height:70vh;
       padding:20px 0px;
       margin:15vh 0 10vh;
       background:transparent;
       border:1px solid black;
       display:flex;
       justify-content:center;
       align-items:center;
       flex-flow:nowrap column;
       gap:2.5%;
     }
     .btns_con{
       height:90%;
       width:80%;
       padding:10px;
       margin:5% 0px;
       border:1px solid black;
       background:#fff;
       background:transparent;
       display:grid;
       grid-template-columns:repeat(3,1fr);
       grid-template-rows:repeat(4,1fr);
       gap:3px;
     }
     .btn{
       font-size:12px;
       font-weight:350;
       display:flex;
       justify-content:center;
       align-items:center;
       background:#ffffff;
       color:black;
       border:1px outset black;
     }
     .btn:active{
       border:1px inset black;
       background:black;
       color:white;
     }
     .show_box{
       height:20%;
       width:40%;
       padding:0px 5px;
       background:brown;
       letter-spacing:1.5px;
       font-size:18px;
       color:red;
       display:flex;
       justify-content:center;
       align-items:center;
     }
     
     /*shape_3*/
     .con_3{
       height:90vh;
       width:100%;
       background:transparent;
       position:relative;
     }
     .view{
       border:1px solid black;
       height:25%;
       width:90%;
       margin:20% 0px 10%;
       border:.8px solid black;
       display:flex;
       flex-flow:nowrap row;
       justify-content:center;
       align-items:center;
       gap:10%;
       background:transparent;
       position:absolute;
       top:2.5%;
       left:5%;
     }
     .box{
       font-size:18px;
       letter-spacing:2px;
       display:flex;
       justify-content:center;
       align-items:center;
       border:1px solid black;
       border-radius:10px;
       height:60%;
       width:25%;
       background:white;
     }
     .con_btns_sh3{
       display:flex;
       justify-content:center;
       align-items:center;
       width:75%;
       height:15%;
       gap:20%;
       background:gray;
       opacity:.8;
       position:absolute;
       left:12.5%;
       top:50%;
     }
     .btn_shape_3{
       height:80%;
       width:25%;
       border:1px solid black;
       border-radius:50%;
       font-size:40px;
     }
     .start_count{
       position:absolute;
       bottom:20%;
       left:37.5%;
       height:10%;
       width:25%;
       font-size:18px;
       border:1px solid black;
       color:black;
       background:white;
       border-radius:10px;
     }
     .con_def{
       height:90vh;
       width:100%;
       background:transparent;
       color:white;
       display:flex;
       justify-content:center;
       align-items:center;
       font-size:18px;
       letter-spacing:1.5px;
       font-weight:400;
       font-style:italic;
     }
     .selected{
        border:1px solid #20c;
        background:white;
        color:black;
      }
      
      .timers_con{
        background:green;
        position:relative;
        max-height:90vh;
        width:950%;
        display:flex;
        justify-content:center;
        align-items:center;
        flex-flow:nowrap column;
        gap:10vh;
      }
      
      footer{
        display:flex;
        flex-flow:nowrap row-reverse;
        justify-content:center;
        align-items:center;
        gap:10%!important;
        position:fixed;
        bottom:0;
        height:8vh;
        width:100%;
        color:white;
        background:#0f17;
      }
    </style>
    <script type='module'>
      import {the_watch} from './watch.mjs'
      import {timerLogic,timerUI} from './stop_watch.mjs'
      document.addEventListener('DOMContentLoaded',()=>{
        

      //Global Variables
        const state={
          'watch':false,
          'stop_watch':false
        }
        
        const random_number =(min,max)=>{
          let num
          min = Math.ceil(min)
          max = Math.floor(max)
          num = Math.floor(Math.random()* (max-min +1) + min)
          
          return num
        }
        function cancel_others(){
          Object.keys(state).forEach( key=>{
            state[key]=false;
            document.querySelector(`.${key}_choice`).classList.remove('turn_on');
            if(!e.target.classList.contains('watch_choice')){
              e.target.querySelectorAll('*').forEach(item=>item.remove())
            }
            e.target.classList.add('turn_on')
          })
          
          btns.forEach(btn=>{
            if(listeners[btn.className]){
              btn.removeEventListener('click',listeners[btn])
            }
            delete listeners[btn.className]
          })
        }
        
        function watch(){
          const main_container = document.querySelector('.watch_choice')
          the_watch(main_container)
        }
        function stop_watch_machine(){
          const main_container = document.querySelector('.stop_watch_choice')
          new timerUI(random_number(1,5),main_container)
          return main_container
        }
        
        
        //select part
        document.querySelector('footer').addEventListener('click',(e)=>{
          switch (true){
            case e.target.closest('.the_watch') && !state.watch:
              document.querySelector('.watch_choice').classList.add('turn_on')
              watch()
              state.watch=true;
              break;
              
            case e.target.closest('.stop_watch') && !state['stop_watch']:
              state.stop_watch=true
              const ele = stop_watch_machine()
              ele.classList.add('turn_on')
              break;
          }
          
        })
      })
    </script>
  </head>
  <body>
    <div class='watch_choice'></div>
    <div class='stop_watch_choice'></div>
    <footer>
      <div class='the_watch'>Watch</div>
      <div class='alarm'>Alarm</div>
      <div class='stop_watch'>Stop Watch</div>
      <div class='timer'>Timer</div>
    </footer>
  </body>
  </html>
